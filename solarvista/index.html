<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solar Vista – TytoGrid</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/solarvista/config.js"></script>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2433; --muted: #5d6676; --line: #e1e5ec; --side: #142257; --side-ink: #e8ecf5;
  --side-muted: #9aa6bf; --accent: #2563eb; --accent-soft: #e8efff; --ok: #157347; --ok-soft: #e3f4ea; --warn: #9a6200;
  --warn-soft: #fff3d6; --bad: #b42318; --bad-soft: #fde8e6; --info-soft: #eef2f7; --grey: #f1f5f9; --grey-ink: #94a3b8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141c; --panel: #171e29; --ink: #e6eaf2; --muted: #9aa4b6; --line: #2a3445; --side: #0b1018; --side-ink: #e6eaf2;
    --side-muted: #7f8aa0; --accent: #6b9bff; --accent-soft: #1d2b47; --ok: #4cc38a; --ok-soft: #12301f; --warn: #f0b84a;
    --warn-soft: #3a2c0c; --bad: #ff7b6e; --bad-soft: #3d1714; --info-soft: #1d2533; --grey: #121821; --grey-ink: #5e6a7e;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Telugu", sans-serif; }
button, select, input { font: inherit; color: inherit; }
#app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
aside { background: var(--side); color: var(--side-ink); padding: 16px 10px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { padding: 4px 10px 14px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 10px; }
.brand b { display: block; font-size: 15px; } .brand span { color: var(--side-muted); font-size: 12px; }
nav button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: none; border-radius: 8px; cursor: pointer; text-align: left; color: var(--side-ink); }
nav button:hover { background: rgba(255,255,255,.06); } nav button.on { background: rgba(255,255,255,.12); font-weight: 600; }
nav .ic { width: 20px; text-align: center; } nav .sep { height: 1px; background: rgba(255,255,255,.08); margin: 8px 6px; }
nav .n { margin-left: auto; font-size: 12px; background: rgba(255,255,255,.12); border-radius: 10px; padding: 1px 8px; }
.me { margin-top: 14px; padding: 10px; font-size: 12px; color: var(--side-muted); border-top: 1px solid rgba(255,255,255,.08); }
main { min-width: 0; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
header h1 { font-size: 18px; margin: 0 12px 0 0; }
header select, header input, .toolbar select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-width: 0; }
header input { width: 200px; } .grow { flex: 1; }
.btn { padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); } .btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; } .btn:disabled { opacity: .5; cursor: default; }
.wrap { padding: 18px 20px 60px; } .muted { color: var(--muted); } .small { font-size: 12px; }
h3.sec { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 6px 0 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; text-align: left; }
.card:hover { border-color: var(--accent); } .card .v { font-size: 26px; font-weight: 700; } .card .l { color: var(--muted); font-size: 12.5px; }
.card .s { font-size: 12px; margin-top: 4px; } .card.p1 { border-left: 4px solid var(--ok); } .card.p2 { border-left: 4px solid var(--warn); } .card.p3 { border-left: 4px solid var(--accent); }
.card.fu { border-left: 4px solid var(--bad); } .card.p4 { border-left: 4px solid var(--warn); } .card.bal { border-left: 4px solid var(--grey-ink); }
.card.red { border-left: 4px solid var(--bad); background: var(--bad-soft); }
.target { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
.target .big { font-size: 24px; font-weight: 700; } .target .grow { flex: 1; min-width: 200px; }
.target .bar { height: 8px; background: var(--grey); border-radius: 6px; overflow: hidden; margin-top: 6px; } .target .bar i { display: block; height: 100%; background: var(--ok); }
.bt { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 8px; background: var(--panel); }
.bt.red { border-color: var(--bad); background: var(--bad-soft); }
.bt form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
nav .n.red { background: var(--bad); color: #fff; margin-left: 4px; }
tr.below td { background: var(--warn-soft); }
.brief { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--side); border-radius: 10px; padding: 14px 18px; margin-bottom: 18px; }
.brief h2 { margin: 0 0 2px; font-size: 18px; } .brief .when { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.brief ul { margin: 0; padding-left: 18px; } .brief li { margin: 5px 0; line-height: 1.5; } .brief li.att { color: var(--bad); } .brief li.ok { color: var(--ok); }
details.more > summary { cursor: pointer; font-weight: 600; margin: 6px 0 12px; color: var(--accent); }
.flink { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
.flink a.btn { text-decoration: none; } .flink code { font-size: 15px; font-weight: 700; color: var(--accent); } .flink .grow { flex: 1; min-width: 160px; }
tr.band th { position: static; text-align: center; font-size: 11.5px; letter-spacing: .02em; text-transform: uppercase; border-bottom: 2px solid var(--line); }
th.bl, td.bl { border-left: 2px solid var(--line); } td.tot, th.tot { font-weight: 700; background: var(--info-soft); }
td .sub { display: block; font-size: 11px; color: var(--muted); font-weight: 400; } tfoot td { font-weight: 700; background: var(--info-soft); } tr.leave td { color: var(--grey-ink); }
.bar { height: 6px; background: var(--info-soft); border-radius: 3px; margin-top: 6px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--ok); }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; } .box h3 { margin: 0 0 10px; font-size: 15px; }
.note { background: var(--warn-soft); border-left: 4px solid var(--warn); border-radius: 6px; padding: 10px 12px; margin: 0 0 12px; }
.note ol { margin: 4px 0 0; padding-left: 20px; } .note li { margin: 2px 0; }
.tw { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--info-soft); position: sticky; top: 0; }
td.num, th.num { text-align: right; } tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: var(--accent-soft); }
tr.svdone td { background: var(--grey); color: var(--grey-ink); } tr.svdone .ph { opacity: .55; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; }
.b { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; white-space: nowrap; background: var(--info-soft); color: var(--muted); margin: 1px 0; }
.b.ok { background: var(--ok-soft); color: var(--ok); } .b.warn { background: var(--warn-soft); color: var(--warn); } .b.bad { background: var(--bad-soft); color: var(--bad); } .b.acc { background: var(--accent-soft); color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; } .toolbar h2 { margin: 0 auto 0 0; font-size: 17px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 4px 11px; cursor: pointer; font-size: 13px; } .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.ph { width: 90px; height: 68px; border: 1px solid var(--line); border-radius: 8px; background: var(--info-soft); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); cursor: pointer; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; }
#zoom { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 40; display: none; align-items: center; justify-content: center; } #zoom.open { display: flex; } #zoom img { max-width: 96vw; max-height: 94vh; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; display: none; z-index: 50; max-width: 90vw; }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center; background: var(--panel); }
.empty { padding: 30px; text-align: center; color: var(--muted); } .loading { padding: 60px; text-align: center; color: var(--muted); }
.flag { border-left: 3px solid var(--bad); padding: 4px 10px; margin: 6px 0; background: var(--bad-soft); border-radius: 0 6px 6px 0; }
#login { position: fixed; inset: 0; background: var(--bg); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; }
.lbox { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; } .lbrand { font-size: 20px; font-weight: 700; }
.lbox input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); margin-top: 4px; }
@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; } aside { position: static; height: auto; padding: 8px; } .brand, .me { display: none; }
  nav { display: flex; overflow-x: auto; gap: 4px; } nav button { width: auto; white-space: nowrap; padding: 7px 10px; } nav .sep { display: none; }
  header { padding: 8px 12px; } header input { width: 100%; } .wrap { padding: 12px; }
}

/* TytoGrid brand */
aside { border-right: 3px solid #F4A62A; }
.brand { display: flex; gap: 10px; align-items: center; }
.brand svg, .tyto svg { flex: 0 0 auto; border-radius: 8px; box-shadow: 0 0 0 1.5px rgba(255,255,255,.35); }
nav button.on { box-shadow: inset 3px 0 0 #F4A62A; }
.btn.pri { background: #1F3A93; border-color: #1F3A93; }
.card { border-top: 3px solid transparent; } .card:hover { border-top-color: #F4A62A; }
.tyto { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 10px; font-size: 11.5px; color: var(--side-muted); text-decoration: none; border-top: 1px solid rgba(255,255,255,.08); }
.tyto:hover { color: var(--side-ink); }
.lbox { border-top: 4px solid #F4A62A; }
footer.tg { text-align: center; font-size: 12px; color: var(--muted); padding: 18px 0 8px; }
@media (max-width: 860px) { aside { border-right: 0; border-bottom: 3px solid #F4A62A; } .tyto { display: none; } }
</style>

<script>
let KEY = new URLSearchParams(location.search).get('key') || '';
const TOK = 'sv_kuppam_session';
const tokStore = { get() { try { return localStorage.getItem(TOK) || ''; } catch (e) { return ''; } }, set(v) { try { if (v) localStorage.setItem(TOK, v); else localStorage.removeItem(TOK); } catch (e) {} } };
if (!KEY) KEY = tokStore.get();
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
// server calls go to the Apps Script back end (exec URL in /solarvista/config.js)
const run = (fn, ...args) => fetch(window.SV_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) })
  .catch(() => { throw new Error('No connection to the server – check the internet and try again.'); })
  .then(r => { if (!r.ok) throw new Error('Server error ' + r.status); return r.json(); })
  .then(j => { if (!j.ok) throw new Error(j.error || 'Server error'); return j.data; });
const toast = (t, ms) => { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', ms || 3500); };
const dmy = s => { const m = /^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}:\d{2}))?/.exec(String(s || '')); return m ? m[3] + '-' + m[2] + (m[4] ? ' ' + m[4] : '') : String(s || ''); };
const ROLE_T = { owner: 'Administrator', manager: 'Manager', mis: 'MIS', viewer: 'Viewer' };
const PRIO = { P1: ['ok', 'P1 · consent only'], P2: ['warn', 'P2 · Excel + consent'], P3: ['acc', 'P3 · feasible, consent'], P4: ['warn', 'P4 · feasible, Excel + consent'],
  SURVEY: ['', 'Balance · feasibility survey'], NOTFEAS: ['', 'Not feasible'], ULA: ['', 'ULA created'], CHECK: ['warn', 'MNRE list only – not in PMSG cloud'], BAD: ['bad', 'Bad service number'],
  CONSENT_ACC: ['bad', 'Consent accepted – no ULA'], CA_NV: ['bad', 'CA not verified'], OTHER: ['', 'Other'], NEW: ['warn', 'Not in any file'] };
const PR = k => PRIO[k] || PRIO.OTHER;
const PGRP = ['P1', 'P2', 'P3', 'P4'];
const GROUP = { 1: ['ok', 'Folder 1 · upload consent now'], 2: ['warn', 'Folder 2 · Excel first'], 3: ['bad', 'Folder 3 · check first'] };

  const wkBy = {}; svWeek.forEach(sn => { const k = bySn[sn] ? bySn[sn].prio : 'other'; wkBy[k] = (wkBy[k] || 0) + 1; });

      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src); ok(c.toDataURL('image/jpeg', 0.8)); };

  });

  if (t.dataset.list) { LIST = t.dataset.list; CHIP = LISTS[LIST].def || ''; PAGE = 'list'; return render(); }
  if (t.dataset.lst) { LIST = t.dataset.lst; CHIP = LISTS[LIST].def || ''; return render(); }
  if (t.dataset.chip !== undefined) { CHIP = t.dataset.chip; return render(); }
  if (t.dataset.vil) { $('fVil').value = t.dataset.vil; return render(); }
  if (t.id === 'csv') return csvDownload(listRows(), 'Kuppam_' + LIST + (CHIP ? '_' + CHIP : '') + '.csv');
  if (t.id === 'reload') return load(true).then(() => { if (PAGE === 'survey') surveyPage(true); });
  if (t.id === 'logout') return logoutNow();
  if (t.id === 'svNew') { const ids = svRows().filter(r => !r.batch).map(r => r.id); if (!ids.length) return toast('Nothing new to download.'); return svBatch(t, 'surveyBatchNew', [ids, svFilterLabel()], true); }
  if (t.id === 'svXls') return svFile(t, 'surveyDetails');
  if (t.id === 'svEE') return svFile(t, 'mobileChanges');
  if (t.id === 'svDept') return svFile(t, 'deptExcel');
  if (t.id === 'svReload') return surveyPage(true);
  if (t.id === 'supReload') return supPage(true);
  if (t.id === 'flCopy') { try { await navigator.clipboard.writeText(FIELD_LINK); toast('Link copied – paste it in WhatsApp.'); } catch (er) { prompt('Copy this link:', FIELD_LINK); } return; }
  if (t.id === 'supXls') { t.disabled = true; try { saveB64(await run('supervisorReport', KEY, 31)); } catch (er) { toast(er.message || er, 6000); } t.disabled = false; return; }
  if (t.dataset.leave) { const p = t.dataset.leave.split('|'); t.disabled = true; try { SUP = JSON.parse(await run('setLeave', KEY, p[0], p[1], p[2] === '1')); supPage(); } catch (er) { toast(er.message || er); t.disabled = false; } return; }
  if (t.dataset.svpdf) { t.disabled = true; try { saveB64(await run('getSurveyFile', KEY, t.dataset.svpdf)); } catch (er) { toast(er.message || er); } t.disabled = false; return; }
  if (t.classList.contains('ph') && t.dataset.photo) {
    if (t.querySelector('img')) { $('zoom').querySelector('img').src = t.querySelector('img').src; $('zoom').classList.add('open'); return; }
    t.textContent = '…'; try { t.innerHTML = '<img src="' + (await run('getPhoto', KEY, t.dataset.photo)) + '">'; } catch (er) { t.textContent = 'error'; } return;
  }
  if (t.id === 'uAdd') { try { drawUsers(await run('saveMailUser', KEY, $('uEmail').value, $('uName').value, $('uRole').value)); toast('Saved'); } catch (er) { toast(er.message || er, 5000); } return; }
  if (t.dataset.deluser) { if (!confirm('Remove ' + t.dataset.deluser + '? All their devices are logged out.')) return; try { drawUsers(await run('removeMailUser', KEY, t.dataset.deluser)); } catch (er) { toast(er.message || er); } return; }
  if (t.id === 'lSend') return loginSend();
  if (t.id === 'lVerify') return loginVerify();
  if (t.id === 'lBack') return showLogin();
});
$('zoom').onclick = () => $('zoom').classList.remove('open');
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'fSec') { fill(); render(); } else if (id === 'fVil') render();
  else if (id === 'svVil' || id === 'svG' || id === 'svP') { SVF[{ svVil: 'vil', svG: 'g', svP: 'p' }[id]] = e.target.value; surveyPage(); }
  else if (id === 'svAgain' && e.target.value) { const sel = e.target; svBatch(sel, 'surveyBatchAgain', [sel.value], false).then(() => { sel.value = ''; }); }
  else if (id === 'upl') upload([...e.target.files]);
  else if (id === 'supN') { SUPN = e.target.value; supPage(); }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-bout]'); if (!f) return; e.preventDefault();
  const o = f.o.value, file = f.p.files[0];
  if (!o) return toast('Choose the upload outcome.'); if (!file) return toast('Add the photo of the portal\'s upload summary screen.');
  const b = f.querySelector('button'); b.disabled = true; b.textContent = 'Saving…';
  try { toast(await run('markBatchOutcome', KEY, f.dataset.bout, o, await shrinkPhoto(file)), 8000); D.bstat = null; await load(true); PAGE = 'survey'; surveyPage(true); }
  catch (er) { toast(er.message || er, 6000); b.disabled = false; b.textContent = 'Save'; }
});
let qT = null; $('q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(render, 250); });
$('lEmail').addEventListener('keydown', e => { if (e.key === 'Enter') loginSend(); });
$('lCode').addEventListener('keydown', e => { if (e.key === 'Enter') loginVerify(); });

// ---------------------------------------------------------------- login & load
function showLogin(msg) { $('login').style.display = 'flex'; $('lErr').textContent = msg || ''; $('lStep1').style.display = ''; $('lStep2').style.display = 'none'; setTimeout(() => $('lEmail').focus(), 50); }
async function loginSend() {
  $('lErr').textContent = ''; $('lSend').disabled = true;
  try { $('lMsg').textContent = await run('loginStart', $('lEmail').value.trim()); $('lStep1').style.display = 'none'; $('lStep2').style.display = ''; $('lCode').value = ''; $('lCode').focus(); }
  catch (e) { $('lErr').textContent = e.message || e; }
  $('lSend').disabled = false;
}
async function loginVerify() {
  $('lErr').textContent = ''; $('lVerify').disabled = true;
  try { KEY = await run('loginVerify', $('lEmail').value.trim(), $('lCode').value); tokStore.set(KEY); $('login').style.display = 'none'; await load(); }
  catch (e) { $('lErr').textContent = e.message || e; }
  $('lVerify').disabled = false;
}
async function logoutNow() { try { await run('logout', KEY); } catch (e) {} tokStore.set(''); KEY = ''; D = null; SVD = null; SUP = null; BRIEF_SUP = null; PAGE = 'dash'; LIST = null; CHIP = ''; showLogin('Logged out.'); }
async function load(keep) {
  if (!KEY) { showLogin(); return; }
  if (!keep) $('page').innerHTML = '<div class="loading">Loading…</div>';
  try {
    D = JSON.parse(await run('getAppData', KEY));
    ROLE = (D.me || {}).role || 'mis';
    $('me').innerHTML = esc((D.me || {}).name) + '<br>' + esc(ROLE_T[ROLE] || ROLE) + (/^s[0-9a-f]{32}$/.test(KEY) ? '<br><button class="btn" id="logout" style="margin-top:8px;padding:3px 10px;font-size:12px">Log out</button>' : '');
    $('clientName').textContent = D.client || 'TytoGrid'; document.title = 'Solar Vista – ' + (D.client || 'TytoGrid');
    $('fresh').textContent = 'Loaded ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    build(); fill(); render();
  } catch (e) {
    if (/Not allowed/.test(e.message || e)) { tokStore.set(''); KEY = ''; showLogin('Your login has ended – log in again.'); return; }
    $('page').innerHTML = '<div class="empty">Could not load: ' + esc(e.message || e) + '</div>';
  }
}
load();
</script>
</body>
</html>
