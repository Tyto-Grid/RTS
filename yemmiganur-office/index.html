<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solar Vista – Yemmiganur survey</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/yemmiganur/config.js"></script>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2433; --muted: #5d6676; --line: #e1e5ec; --side: #142257; --side-ink: #e8ecf5;
  --side-muted: #9aa6bf; --accent: #2563eb; --accent-soft: #e8efff; --ok: #157347; --ok-soft: #e3f4ea; --warn: #9a6200;
  --warn-soft: #fff3d6; --bad: #b42318; --bad-soft: #fde8e6; --info-soft: #eef2f7; --grey: #f1f5f9; --grey-ink: #94a3b8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141c; --panel: #171e29; --ink: #e6eaf2; --muted: #9aa4b6; --line: #2a3445; --side: #0b1018; --side-ink: #e6eaf2;
    --side-muted: #7f8aa0; --accent: #6b9bff; --accent-soft: #1d2b47; --ok: #4cc38a; --ok-soft: #12301f; --warn: #f0b84a;
    --warn-soft: #3a2c0c; --bad: #ff7b6e; --bad-soft: #3d1714; --info-soft: #1d2533; --grey: #121821; --grey-ink: #5e6a7e;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Telugu", sans-serif; }
button, select, input { font: inherit; color: inherit; }
#app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
aside { background: var(--side); color: var(--side-ink); padding: 16px 10px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { padding: 4px 10px 14px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 10px; }
.brand b { display: block; font-size: 15px; } .brand span { color: var(--side-muted); font-size: 12px; }
nav button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: none; border-radius: 8px; cursor: pointer; text-align: left; color: var(--side-ink); }
nav button:hover { background: rgba(255,255,255,.06); } nav button.on { background: rgba(255,255,255,.12); font-weight: 600; }
nav .ic { width: 20px; text-align: center; } nav .sep { height: 1px; background: rgba(255,255,255,.08); margin: 8px 6px; }
nav .n { margin-left: auto; font-size: 12px; background: rgba(255,255,255,.12); border-radius: 10px; padding: 1px 8px; }
.me { margin-top: 14px; padding: 10px; font-size: 12px; color: var(--side-muted); border-top: 1px solid rgba(255,255,255,.08); }
main { min-width: 0; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
header h1 { font-size: 18px; margin: 0 12px 0 0; }
header select, header input, .toolbar select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-width: 0; }
header input { width: 200px; } .grow { flex: 1; }
.btn { padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); } .btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; } .btn:disabled { opacity: .5; cursor: default; }
.wrap { padding: 18px 20px 60px; } .muted { color: var(--muted); } .small { font-size: 12px; }
h3.sec { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 6px 0 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; text-align: left; }
.card:hover { border-color: var(--accent); } .card .v { font-size: 26px; font-weight: 700; } .card .l { color: var(--muted); font-size: 12.5px; }
.card .s { font-size: 12px; margin-top: 4px; } .card.p1 { border-left: 4px solid var(--ok); } .card.p2 { border-left: 4px solid var(--warn); } .card.p3 { border-left: 4px solid var(--accent); }
.card.fu { border-left: 4px solid var(--bad); } .card.p4 { border-left: 4px solid var(--warn); } .card.bal { border-left: 4px solid var(--grey-ink); }
.card.red { border-left: 4px solid var(--bad); background: var(--bad-soft); }
.dl { background: var(--panel); border: 2px solid var(--bad); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
.dl.ok { border-color: var(--ok); } .dl h3 { margin: 0 0 4px; font-size: 16px; } .dl .verdict { font-size: 17px; font-weight: 700; margin: 6px 0 10px; }
.dl .row { display: flex; flex-wrap: wrap; gap: 10px; } .dl .k { flex: 1; min-width: 150px; background: var(--grey); border-radius: 8px; padding: 8px 10px; }
.dl .k .v { font-size: 22px; font-weight: 700; } .dl .k.need .v { color: var(--bad); } .dl .k.good .v { color: var(--ok); }
.target { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
.target .big { font-size: 24px; font-weight: 700; } .target .grow { flex: 1; min-width: 200px; }
.target .bar { height: 8px; background: var(--grey); border-radius: 6px; overflow: hidden; margin-top: 6px; } .target .bar i { display: block; height: 100%; background: var(--ok); }
.bt { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 8px; background: var(--panel); }
.bt.red { border-color: var(--bad); background: var(--bad-soft); }
.bt form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
nav .n.red { background: var(--bad); color: #fff; margin-left: 4px; }
tr.below td { background: var(--warn-soft); }
.brief { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--side); border-radius: 10px; padding: 14px 18px; margin-bottom: 18px; }
.brief h2 { margin: 0 0 2px; font-size: 18px; } .brief .when { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.brief ul { margin: 0; padding-left: 18px; } .brief li { margin: 5px 0; line-height: 1.5; } .brief li.att { color: var(--bad); }
.vp { background: #142257; color: #fff; border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; }
.vp.two { background: #1b2a63; } .vp h2 { margin: 0; font-size: 19px; color: #fff; } .vp .vk { font-size: 12.5px; color: #AEB8D6; }
.vp .vtop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; } .vp .vsub { color: #C7CFE6; font-size: 13px; margin: 3px 0 12px; }
.vcells { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(124px, 1fr); gap: 7px; overflow-x: auto; padding-bottom: 2px; }
.vc { position: relative; background: #2B3F86; border-radius: 8px; padding: 34px 10px 10px; min-height: 150px; display: flex; flex-direction: column; justify-content: flex-start; color: #DCE2F2; overflow: hidden; border: 0; text-align: left; font: inherit; cursor: pointer; }
.vc::before, .vc::after { content: ""; position: absolute; top: 0; bottom: 0; width: 1.5px; background: rgba(20,34,87,.35); } .vc::before { left: 33%; } .vc::after { left: 66%; }
.vc > * { position: relative; z-index: 1; } .vc .vt { position: absolute; top: 8px; left: 10px; font-size: 12px; font-weight: 800; background: rgba(255,255,255,.18); padding: 1px 7px; border-radius: 10px; }
.vc .vv { font-size: 23px; font-weight: 800; line-height: 1.1; } .vc .vr { font-size: 14.5px; font-weight: 700; } .vc .vl { font-size: 12.5px; font-weight: 600; margin-top: 2px; line-height: 1.25; } .vc .va { font-size: 11.5px; opacity: .85; margin-top: 2px; line-height: 1.25; }
.vc:hover { filter: brightness(1.12); } .vc.hot { background: #F4A62A; color: #142257; } .vc.hot .vt { background: rgba(20,34,87,.15); }
.vc.red { background: #D9454F; color: #fff; } .vc.ok { background: #1f7a4d; color: #fff; } .vc.dim { opacity: .65; }
table.money td, table.money th { padding: 8px 10px; } table.money td.rs { font-weight: 700; text-align: right; white-space: nowrap; } table.money tr.click:hover td { background: var(--info-soft); cursor: pointer; }
table.money tfoot td { font-weight: 700; background: var(--info-soft); } .money-wrap { margin-bottom: 18px; } .red-t { color: var(--bad); } .brief li.ok { color: var(--ok); }
details.more > summary { cursor: pointer; font-weight: 600; margin: 6px 0 12px; color: var(--accent); }
.flink { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
.flink a.btn { text-decoration: none; } .flink code { font-size: 15px; font-weight: 700; color: var(--accent); } .flink .grow { flex: 1; min-width: 160px; }
tr.band th { position: static; text-align: center; font-size: 11.5px; letter-spacing: .02em; text-transform: uppercase; border-bottom: 2px solid var(--line); }
th.bl, td.bl { border-left: 2px solid var(--line); } td.tot, th.tot { font-weight: 700; background: var(--info-soft); }
td .sub { display: block; font-size: 11px; color: var(--muted); font-weight: 400; } tfoot td { font-weight: 700; background: var(--info-soft); } tr.leave td { color: var(--grey-ink); }
.bar { height: 6px; background: var(--info-soft); border-radius: 3px; margin-top: 6px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--ok); }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; } .box h3 { margin: 0 0 10px; font-size: 15px; }
.note { background: var(--warn-soft); border-left: 4px solid var(--warn); border-radius: 6px; padding: 10px 12px; margin: 0 0 12px; }
.note ol { margin: 4px 0 0; padding-left: 20px; } .note li { margin: 2px 0; }
.tw { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--info-soft); position: sticky; top: 0; }
td.num, th.num { text-align: right; } tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: var(--accent-soft); }
tr.svdone td { background: var(--grey); color: var(--grey-ink); } tr.svdone .ph { opacity: .55; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; }
.b { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; white-space: nowrap; background: var(--info-soft); color: var(--muted); margin: 1px 0; }
.b.ok { background: var(--ok-soft); color: var(--ok); } .b.warn { background: var(--warn-soft); color: var(--warn); } .b.bad { background: var(--bad-soft); color: var(--bad); } .b.acc { background: var(--accent-soft); color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; } .toolbar h2 { margin: 0 auto 0 0; font-size: 17px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: linear-gradient(135deg, rgba(37,99,235,.06), rgba(37,99,235,.16)); color: var(--ink); border-radius: 18px; padding: 7px 15px; cursor: pointer; font-size: 14px; transition: transform .08s, box-shadow .15s; }
.chip:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,.12); }
.chip.on { background: linear-gradient(135deg, #3b82f6, #1d4ed8); border-color: transparent; color: #fff; box-shadow: 0 2px 8px rgba(29,78,216,.35); }
/* list buttons: one colour family per row */
.lc .chip { border-color: transparent; font-weight: 500; }
.lc.g0 .chip { background: linear-gradient(135deg, rgba(59,130,246,.14), rgba(37,99,235,.30)); } .lc.g0 .chip.on { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; }
.lc.g1 .chip { background: linear-gradient(135deg, rgba(34,197,94,.14), rgba(21,128,61,.30)); } .lc.g1 .chip.on { background: linear-gradient(135deg, #22c55e, #15803d); color: #fff; }
.lc.g2 .chip { background: linear-gradient(135deg, rgba(245,158,11,.16), rgba(217,119,6,.32)); } .lc.g2 .chip.on { background: linear-gradient(135deg, #f59e0b, #c2410c); color: #fff; }
.lc.g3 .chip { background: linear-gradient(135deg, rgba(168,85,247,.14), rgba(126,34,206,.30)); } .lc.g3 .chip.on { background: linear-gradient(135deg, #a855f7, #7e22ce); color: #fff; }
.lc.g4 .chip { background: linear-gradient(135deg, rgba(239,68,68,.14), rgba(185,28,28,.30)); } .lc.g4 .chip.on { background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; }
.lc .chip.hot { background: linear-gradient(135deg, #ef4444, #991b1b); color: #fff; font-weight: 700; box-shadow: 0 2px 8px rgba(185,28,28,.35); }
.lc .chip.hot.on { outline: 3px solid rgba(239,68,68,.45); outline-offset: 1px; }
.lc .gl { align-self: center; min-width: 120px; font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.ph { width: 90px; height: 68px; border: 1px solid var(--line); border-radius: 8px; background: var(--info-soft); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); cursor: pointer; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; }
#zoom { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 40; display: none; align-items: center; justify-content: center; } #zoom.open { display: flex; } #zoom img { max-width: 96vw; max-height: 94vh; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; display: none; z-index: 50; max-width: 90vw; }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center; background: var(--panel); }
.empty { padding: 30px; text-align: center; color: var(--muted); } .loading { padding: 60px; text-align: center; color: var(--muted); }
.flag { border-left: 3px solid var(--bad); padding: 4px 10px; margin: 6px 0; background: var(--bad-soft); border-radius: 0 6px 6px 0; }
#login { position: fixed; inset: 0; background: var(--bg); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; }
.lbox { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; } .lbrand { font-size: 20px; font-weight: 700; }
.lbox input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); margin-top: 4px; }
@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; } aside { position: static; height: auto; padding: 8px; } .brand, .me { display: none; }
  nav { display: flex; overflow-x: auto; gap: 4px; } nav button { width: auto; white-space: nowrap; padding: 7px 10px; } nav .sep { display: none; }
  header { padding: 8px 12px; } header input { width: 100%; } .wrap { padding: 12px; }
}

/* TytoGrid brand */
aside { border-right: 3px solid #F4A62A; }
.brand { display: flex; gap: 10px; align-items: center; }
.brand svg, .tyto svg { flex: 0 0 auto; border-radius: 8px; box-shadow: 0 0 0 1.5px rgba(255,255,255,.35); }
nav button.on { box-shadow: inset 3px 0 0 #F4A62A; }
.btn.pri { background: #1F3A93; border-color: #1F3A93; }
.card { border-top: 3px solid transparent; } .card:hover { border-top-color: #F4A62A; }
.tyto { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 10px; font-size: 11.5px; color: var(--side-muted); text-decoration: none; border-top: 1px solid rgba(255,255,255,.08); }
.tyto:hover { color: var(--side-ink); }
.lbox { border-top: 4px solid #F4A62A; }
footer.tg { text-align: center; font-size: 12px; color: var(--muted); padding: 18px 0 8px; }
@media (max-width: 860px) { aside { border-right: 0; border-bottom: 3px solid #F4A62A; } .tyto { display: none; } }
</style>
</head>

  BAD: ['bad', 'Bad service number'], CONSENT_ACC: ['bad', 'Consent accepted – no ULA'], CA_NV: ['bad', 'CA not verified'], PRE: ['warn', 'Consent taken earlier'], OTHER: ['', 'Other'], NEW: ['warn', 'Not in any file'] };

const PGRP = ['P1', 'P2'];
const GROUP = { 1: ['ok', 'Folder 1 · upload consent now'], 2: ['warn', 'Folder 2 · Excel first'], 3: ['bad', 'Folder 3 · check first'] };
const VERD = ['Feasible', 'Special structure', 'Needs action', 'Not eligible', 'Not feasible', 'Consent No'];
const VCLS = { 'Feasible': 'ok', 'Special structure': 'acc', 'Needs action': 'warn', 'Not eligible': 'bad', 'Not feasible': 'bad', 'Consent No': '' };

// sv:    [at, gender, downloaded, holdReason, verdict, roof, structure, earthing m, DC m, AC m, meter, surveyor, reasons, consentPdf]
function build() {
  const ours = (D.sites || []).some(r => r[17]);
  S = (D.sites || []).filter(r => ours ? r[17] : r[14] !== 'BAD').map(r => ({ sn: r[0], name: r[1], mob: r[2], dist: r[3], sec: r[4], sub: r[29] || '', ins: r[5], dcr: !!r[6], cl: !!r[7], ca: r[8], cs: r[9], ula: r[10], us: r[11],

function fill() {
  const sel = (id, vals, cur, all) => { $(id).innerHTML = '<option value="">' + all + '</option>' + vals.map(v => '<option' + (v === cur ? ' selected' : '') + '>' + esc(v) + '</option>').join(''); };

function scope() {
  const a = $('fSec').value, b = $('fVil').value, q = norm($('q').value);

}
// ---------------------------------------------------------------- lists behind the badges
const LISTS = {
  TODO: { t: 'To survey – not met yet', f: s => s.field && !s.sv, chips: [['', 'All'], ['p1', 'On the portal'], ['p2', 'Not on the portal'], ['rv', 'Visited – customer not available']], c: { p1: s => s.prio === 'P1', p2: s => s.prio === 'P2', rv: s => !!s.na } },
  GO: { t: 'Can go ahead – Feasible, Special structure, Needs action', f: s => GO(s.v), chips: [['', 'All'], ['dl', 'Sent to the Department'], ['nodl', 'Not sent yet']], c: { dl: s => s.sv[2], nodl: s => !s.sv[2] } },
  V_F: { t: 'Feasible', f: s => s.v === 'Feasible', chips: [] },
  V_SP: { t: 'Special structure – sheet or mud roof', f: s => s.v === 'Special structure', chips: [['', 'All'], ['sheet', 'Sheet roof'], ['mud', 'Mud roof']], c: { sheet: s => /^Sheet/.test(s.sv[5]), mud: s => /^Mud/.test(s.sv[5]) } },
  V_ACT: { t: 'Needs action first – meter, earth pits or shade', f: s => s.v === 'Needs action', chips: [['', 'All'], ['meter', 'Meter absent / burnt / not reading'], ['pits', 'Earth pits short'], ['shade', 'Heavy shade']],
    c: { meter: s => /meter/.test(s.sv[12]), pits: s => /earth pits/.test(s.sv[12]), shade: s => /shade/.test(s.sv[12]) } },
  V_NE: { t: 'Not eligible – above 200 units or 3 phase', f: s => s.v === 'Not eligible', chips: [] },
  V_NF: { t: 'Not feasible – thatched, tiled / sloped or weak roof, no space', f: s => s.v === 'Not feasible', chips: [] },
  V_NO: { t: 'Consent No', f: s => s.v === 'Consent No', chips: [] },
  REVISIT: { t: 'Customer not available – revisit', f: s => !!s.na && !s.sv, chips: [['', 'All'], ['n3', '3 visits or more']], c: { n3: s => s.na[0] >= 3 } },
  DONE: { t: 'Already installed – not for the survey', f: s => s.done, chips: [['', 'All'], ['dcr', 'DCR done'], ['ins', 'Installed, no DCR']], c: { dcr: s => s.prio === 'DCR', ins: s => s.prio === 'INST' } },
  ULA: { t: 'ULA created (not installed)', f: s => s.prio === 'ULA', chips: [] },
  PRE: { t: 'Consent collected before the app', f: s => s.prio === 'PRE', chips: [] },
  CONSENT_ACC: { t: 'Consent accepted – no ULA in our lists (MIS to check)', f: s => s.prio === 'CONSENT_ACC', chips: [] },
  CA_NV: { t: 'CA not verified / not eligible (follow up with MNRE)', f: s => s.prio === 'CA_NV', chips: [] },
  REJ: { t: 'Rejected by the portal (Invalid Consumer Data)', f: s => !!s.rej, chips: [] },
  MOB: { t: 'Database mobile shared with another house', f: s => s.shared > 0 && s.field, chips: [] },

  PROB: { t: 'Data problems in the files', f: s => !!s.prob, chips: [] },
};
const PAGES = [['dash', '▦', 'Dashboard'], ['list', '☰', 'Lists'], ['survey', '📝', 'Survey'], ['sup', '👤', 'Supervisors'], ['pay', '₹', 'Payments', 'manage'], ['-'], ['files', '⬆', 'Daily files'], ['settings', '⚙', 'Settings', 'owner']];
function nav() {
  $('nav').innerHTML = PAGES.filter(p => !p[3] || can[p[3]]()).map(p => p[0] === '-' ? '<div class="sep"></div>' :
    '<button data-page="' + p[0] + '" class="' + (PAGE === p[0] ? 'on' : '') + '"><span class="ic">' + p[1] + '</span>' + p[2] +
    (p[0] === 'survey' ? '<span class="n">' + Object.keys(D.sv || {}).length + '</span>' + ((D.bstat || {}).red ? '<span class="n red" title="batches needing action">' + D.bstat.red + '</span>' : '') : '') + '</button>').join('');
}
function render() {
  if ((PAGE === 'settings' && !can.owner()) || (PAGE === 'pay' && !can.manage())) PAGE = 'dash';
  nav(); $('title').textContent = { dash: 'Dashboard', list: LIST ? LISTS[LIST].t : 'Lists', survey: 'Survey', sup: 'Supervisors', pay: 'Supervisor payments', files: 'Daily files', settings: 'Settings' }[PAGE];

}
const daysSince = d => d ? Math.floor((Date.now() - new Date(d + 'T00:00:00+05:30')) / 864e5) : -1;
const N = v => Number(v || 0).toLocaleString('en-IN');
function card(key, v, l, s, cls) { return '<button class="card ' + (cls || '') + '" data-list="' + key + '"><div class="v">' + N(v) + '</div><div class="l">' + l + '</div>' + (s ? '<div class="s muted">' + s + '</div>' : '') + '</button>'; }
function counts(A) {
  const c = { all: A.length, done: 0, ula: 0, other: 0, field: 0, met: 0, todo: 0, rv: 0, go: 0, earth: 0, dc: 0, ac: 0, s14: 0, s22: 0 }; VERD.forEach(v => c[v] = 0);
  A.forEach(s => {

      card('GO', c.go, '<b>Can go ahead</b>', 'Feasible + Special structure + Needs action', 'p1') +
      card('V_F', c['Feasible'], '<b>Feasible</b>', 'install as normal', 'p1') +
      card('V_SP', c['Special structure'], '<b>Special structure</b>', 'sheet or mud roof', 'p3') +
      card('V_ACT', c['Needs action'], '<b>Needs action first</b>', 'meter, earth pits or shade', 'p2') +
      card('V_NE', c['Not eligible'], '<b>Not eligible</b>', 'above 200 units or 3 phase', 'fu') +
      card('V_NF', c['Not feasible'], '<b>Not feasible</b>', 'thatched, tiled / sloped or weak roof, no space', 'fu') +

// ---------------------------------------------------------------- material estimate from the cable lengths the supervisors typed
function boqBox(c) {
  if (!c.go) return '';
  return '<div class="box"><h3>Material for the ' + N(c.go) + ' houses that can go ahead ' + (can.work() ? '<button class="btn" id="boqXls" style="float:right">⬇ Material estimate by distribution (Excel)</button>' : '') + '</h3>' +

    '<div class="card"><div class="v">' + N(c.go) + '</div><div class="l">Inverters</div><div class="s muted">structure 1×4: ' + N(c.s14) + ' · 2×2: ' + N(c.s22) + '</div></div>' +

// ---------------------------------------------------------------- deadline: visits needed per day vs done
function deadlineBox(c) {

  const daysTo = e => Math.max(0, Math.round((Date.parse(e) - Date.parse(today)) / 864e5) + 1), fd = daysTo(fe), pd = daysTo(pe);

  const wk = d => { let t = 0; for (let k = 1; k <= 7; k++) t += d[ago(k)] || 0; return t; };
  const vAvg = Math.round(wk(svd) / 7), vNeed = fd ? Math.ceil(left / fd) : left, vProj = vAvg * fd, dt = D.dayTarget || 25;
  const ud = D.ulaDays || {}, uAvg = Math.round(wk(ud) / 7), uKnown = Object.keys(ud).length > 0;
  const ok = !left || vAvg >= vNeed;
  const verdict = !left ? 'Every field house has been visited. Now finish the portal uploads before ' + dm(pe) + '.'

    : ok ? 'On track: ' + N(vAvg) + ' houses a day against ' + N(vNeed) + ' needed.'
    : 'Short: at ' + N(vAvg) + ' houses a day the field covers about ' + N(vProj) + ' of the ' + N(left) + ' left by ' + dm(fe) + '. Need ' + N(vNeed) + ' a day (' + N(Math.ceil(vNeed / dt)) + ' supervisors at ' + dt + ' each) – or survey the likely-feasible distributions first.';
  return '<div class="dl' + (ok ? ' ok' : '') + '">' + (ROLE ? '<button class="btn" id="repPdf" style="float:right">⬇ Survey report (PDF, from day one)</button>' : '') + '<h3>MNRE cut-off ' + dm(pe) + ' · field work to end ' + dm(fe) + ' (' + fd + ' day' + (fd === 1 ? '' : 's') + ' left, Sundays included)</h3>' +
    '<div class="verdict" style="color:var(--' + (ok ? 'ok' : 'bad') + ')">' + verdict + '</div><div class="row">' +
    '<div class="k need"><div class="small muted">Houses to visit per day</div><div class="v">' + N(vNeed) + '</div><div class="small muted">' + N(left) + ' houses ÷ ' + fd + ' days</div></div>' +
    '<div class="k ' + (ok ? 'good' : '') + '"><div class="small muted">Houses surveyed (met)</div><div class="v">' + N(svd[today] || 0) + '</div><div class="small muted">today so far · yesterday ' + N(svd[ago(1)] || 0) + ' · 7-day average ' + N(vAvg) + '</div></div>' +
    '<div class="k good"><div class="small muted">Can go ahead</div><div class="v">' + N(gd[today] || 0) + '</div><div class="small muted">found today · yesterday ' + N(gd[ago(1)] || 0) + ' · 7-day average ' + N(Math.round(wk(gd) / 7)) + '</div></div>' +

  const t = e.target.closest('button, tr[data-vil], .ph, [data-list]'); if (!t) return;
  if (t.dataset.page) { PAGE = t.dataset.page; if (PAGE === 'list') CHIP = LISTS[LIST || 'TODO'].def || ''; return render(); }
  if (t.dataset.list) { LIST = t.dataset.list; CHIP = LISTS[LIST].def || ''; PAGE = 'list'; return render(); }
  if (t.dataset.lst) { LIST = t.dataset.lst; CHIP = LISTS[LIST].def || ''; return render(); }
  if (t.dataset.chip !== undefined) { CHIP = t.dataset.chip; return render(); }
  if (t.dataset.vil) { $('fVil').value = t.dataset.vil; return render(); }
  if (t.id === 'csv') return csvDownload(listRows(), 'Yemmiganur_' + LIST + (CHIP ? '_' + CHIP : '') + '.csv');
  if (t.id === 'boqXls') { t.disabled = true; try { const o = await run('boqExcel', KEY, null); saveB64(o); toast(o.n + ' houses – ' + o.name); } catch (er) { toast(er.message || er, 6000); } t.disabled = false; return; }
  if (t.id === 'svBoq') return svFile(t, 'boqExcel');
  if (t.id === 'reload') return load(true).then(() => { if (PAGE === 'survey') surveyPage(true); });
  if (t.id === 'logout') return logoutNow();
  if (t.id === 'svNew') { const ids = svRows().filter(r => !r.batch).map(r => r.id); if (!ids.length) return toast('Nothing new to download.'); return svBatch(t, 'surveyBatchNew', [ids, svFilterLabel()], true); }
  if (t.id === 'svXls') return svFile(t, 'surveyDetails');
  if (t.id === 'svEE') return svFile(t, 'mobileChanges');
  if (t.id === 'svDept') return svFile(t, 'deptExcel');
  if (t.id === 'svReload') return surveyPage(true);
  if (t.id === 'supReload') return supPage(true);
  if (t.id === 'payReload') return payPage(true);
  if (t.id === 'payXls') { t.disabled = true; try { saveB64(await run('paymentsExcel', KEY)); } catch (er) { toast(er.message || er, 6000); } t.disabled = false; return; }
  if (t.id === 'supAdd') { try { drawSupReg(await run('supSave', KEY, '', $('sName').value, $('sMob').value, $('sSc').value, true)); toast('Added – give the supervisor the PIN shown.'); } catch (er) { toast(er.message || er, 6000); } return; }
  if (t.dataset.supact) { const [a, id] = t.dataset.supact.split('|'), u = (SREG || []).find(x => x.id === id); t.disabled = true;
    try { drawSupReg(a === 'pin' ? await run('supNewPin', KEY, id) : await run('supSave', KEY, id, u.name, u.mob, u.sc, a === 'on')); } catch (er) { toast(er.message || er, 6000); t.disabled = false; } return; }
  if (t.dataset.dec !== undefined && t.dataset.dec) { const [id, dec] = t.dataset.dec.split('|'); t.disabled = true; try { await run('setDecision', KEY, id, dec); PAY = null; toast(dec ? dec + '.' : 'Decision cleared.'); surveyPage(true); } catch (er) { toast(er.message || er, 6000); t.disabled = false; } return; }
  if (t.id === 'flWa') {   // one WhatsApp Web tab, reused on every click (named window) – no new tab each time
    const msg = 'Yemmiganur survey – open this link on your phone in Chrome, pick your name, type your PIN and start:\n' + FIELD_LINK;
    const w = window.open('https://web.whatsapp.com/send?text=' + encodeURIComponent(msg), 'sv_whatsapp'); if (w) w.focus(); return; }
  if (t.id === 'flCopy') { try { await navigator.clipboard.writeText(FIELD_LINK); toast('Link copied – paste it in WhatsApp.'); } catch (er) { prompt('Copy this link:', FIELD_LINK); } return; }
  if (t.id === 'repPdf') { t.disabled = true; const x = t.textContent; t.textContent = 'Preparing PDF…'; try { saveB64(await run('surveyReportPdf', KEY)); } catch (er) { toast(er.message || er, 6000); } t.disabled = false; t.textContent = x; return; }
  if (t.id === 'supXls') { t.disabled = true; try { saveB64(await run('supervisorReport', KEY, 31)); } catch (er) { toast(er.message || er, 6000); } t.disabled = false; return; }
  if (t.dataset.leave) { const p = t.dataset.leave.split('|'); t.disabled = true; try { SUP = JSON.parse(await run('setLeave', KEY, p[0], p[1], p[2] === '1')); supPage(); } catch (er) { toast(er.message || er); t.disabled = false; } return; }
  if (t.dataset.svpdf) { t.disabled = true; try { saveB64(await run('getSurveyFile', KEY, t.dataset.svpdf)); } catch (er) { toast(er.message || er); } t.disabled = false; return; }
  if (t.classList.contains('ph') && t.dataset.photo) {
    if (t.querySelector('img')) { $('zoom').querySelector('img').src = t.querySelector('img').src; $('zoom').classList.add('open'); return; }
    t.textContent = '…'; try { t.innerHTML = '<img src="' + (await run('getPhoto', KEY, t.dataset.photo)) + '">'; } catch (er) { t.textContent = 'error'; } return;
  }
  if (t.id === 'uAdd') { try { drawUsers(await run('saveMailUser', KEY, $('uEmail').value, $('uName').value, $('uRole').value)); toast('Saved'); } catch (er) { toast(er.message || er, 5000); } return; }
  if (t.dataset.deluser) { if (!confirm('Remove ' + t.dataset.deluser + '? All their devices are logged out.')) return; try { drawUsers(await run('removeMailUser', KEY, t.dataset.deluser)); } catch (er) { toast(er.message || er); } return; }
  if (t.id === 'lSend') return loginSend();
  if (t.id === 'lVerify') return loginVerify();
  if (t.id === 'lBack') return showLogin();
});
$('zoom').onclick = () => $('zoom').classList.remove('open');
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.back) {               // reason a house went back
    const sel = e.target, sn = sel.dataset.back; sel.disabled = true;
    run('setBackReason', KEY, sn, sel.value).then(() => { const x = S.find(s => s.sn === sn); if (x && x.back) { x.back[4] = sel.value; x.back[5] = sel.value ? (D.me && D.me.name) || '' : ''; }
      if (D.back && D.back[sn]) D.back[sn][4] = sel.value; toast(sel.value ? 'Reason saved.' : 'Reason cleared.'); })
      .catch(er => toast(er.message || er, 6000)).then(() => { sel.disabled = false; });
    return;
  }
  const id = e.target.id;
  if (id === 'fSec') { fill(); render(); } else if (id === 'fVil') render();
  else if (id === 'svVil' || id === 'svG' || id === 'svP') { SVF[{ svVil: 'vil', svG: 'g', svP: 'p' }[id]] = e.target.value; surveyPage(); }
  else if (id === 'svAgain' && e.target.value) { const sel = e.target; svBatch(sel, 'surveyBatchAgain', [sel.value], false).then(() => { sel.value = ''; }); }
  else if (id === 'upl') upload([...e.target.files]);
  else if (id === 'supN') { SUPN = e.target.value; supPage(); }
});
document.addEventListener('submit', async e => {
  const fp = e.target.closest('form[data-pay]');
  if (fp) { e.preventDefault(); const amt = fp.a.value, nm = (PAY.rows.find(p => p.id === fp.dataset.pay) || {}).name;
    if (!confirm('Record ₹' + amt + ' paid to ' + nm + '?')) return;
    try { PAY = JSON.parse(await run('recordPayment', KEY, fp.dataset.pay, amt, fp.n.value)); payPage(); toast('Payment recorded.'); } catch (er) { toast(er.message || er, 6000); } return; }
  const f = e.target.closest('form[data-bout]'); if (!f) return; e.preventDefault();
  const o = f.o.value, file = f.p.files[0];
  if (!o) return toast('Choose the upload outcome.'); if (!file) return toast('Add the photo of the portal\'s upload summary screen.');
  const b = f.querySelector('button'); b.disabled = true; b.textContent = 'Saving…';
  try { toast(await run('markBatchOutcome', KEY, f.dataset.bout, o, await shrinkPhoto(file)), 8000); D.bstat = null; await load(true); PAGE = 'survey'; surveyPage(true); }
  catch (er) { toast(er.message || er, 6000); b.disabled = false; b.textContent = 'Save'; }
});
let qT = null; $('q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(render, 250); });
$('lEmail').addEventListener('keydown', e => { if (e.key === 'Enter') loginSend(); });
$('lCode').addEventListener('keydown', e => { if (e.key === 'Enter') loginVerify(); });

// ---------------------------------------------------------------- login & load
function showLogin(msg) { $('login').style.display = 'flex'; $('lErr').textContent = msg || ''; $('lStep1').style.display = ''; $('lStep2').style.display = 'none'; setTimeout(() => $('lEmail').focus(), 50); }
async function loginSend() {
  $('lErr').textContent = ''; $('lSend').disabled = true;
  try { $('lMsg').textContent = await run('loginStart', $('lEmail').value.trim()); $('lStep1').style.display = 'none'; $('lStep2').style.display = ''; $('lCode').value = ''; $('lCode').focus(); }
  catch (e) { $('lErr').textContent = e.message || e; }
  $('lSend').disabled = false;
}
async function loginVerify() {
  $('lErr').textContent = ''; $('lVerify').disabled = true;
  try { KEY = await run('loginVerify', $('lEmail').value.trim(), $('lCode').value); tokStore.set(KEY); $('login').style.display = 'none'; await load(); }
  catch (e) { $('lErr').textContent = e.message || e; }
  $('lVerify').disabled = false;
}
async function logoutNow() { try { await run('logout', KEY); } catch (e) {} tokStore.set(''); KEY = ''; D = null; SVD = null; SUP = null; BRIEF_SUP = null; PAGE = 'dash'; LIST = null; CHIP = ''; showLogin('Logged out.'); }
async function load(keep) {
  if (!KEY) { showLogin(); return; }
  if (!keep) $('page').innerHTML = '<div class="loading">Loading…</div>';
  try {
    D = JSON.parse(await run('getAppData', KEY));
    ROLE = (D.me || {}).role || 'mis';
    $('me').innerHTML = esc((D.me || {}).name) + '<br>' + esc(ROLE_T[ROLE] || ROLE) + (/^s[0-9a-f]{32}$/.test(KEY) ? '<br><button class="btn" id="logout" style="margin-top:8px;padding:3px 10px;font-size:12px">Log out</button>' : '');
    $('clientName').textContent = D.client || 'TytoGrid'; document.title = 'Solar Vista – ' + (D.client || 'TytoGrid');
    $('fresh').textContent = 'Loaded ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    build(); fill(); render();
  } catch (e) {
    if (/Not allowed/.test(e.message || e)) { tokStore.set(''); KEY = ''; showLogin('Your login has ended – log in again.'); return; }
    $('page').innerHTML = '<div class="empty">Could not load: ' + esc(e.message || e) + '</div>';
  }
}
load();
</script>
</body>
</html>
